[project]
name = "micro-qwen3"
version = "1.0.0"
description = "A 1M-parameter Qwen3-architecture model trained from scratch on TinyStories, running on an ESP32-S3"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alex Anokhin" }]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "mlx>=0.32.4",
    "numpy>=2.5.4",
    "tokenizers>=0.23.3",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "training"
